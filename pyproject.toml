[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
dependencies = [
  "loggerplusplus",
  "pygame",
  "flask>=3.0.0",
  "flask-cors>=6.0.2",
]
description = "Simple Sudoku solver implemented in Python."
license = {file = "LICENSE"}
name = "sudoku-solver"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[dependency-groups]
dev = [
  "isort>=7.0.0",
  "mypy>=1.19.1",
  "pdoc>=16.0.0",
  "pydoclint>=0.8.3",
  "pylint>=4.0.4",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "requests>=2.31.0",
  "ruff>=0.14.11",
]

[tool.isort]
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = ["sudoku"]
line_length = 88
multi_line_output = 3
profile = "black"
skip_glob = ["*/sudoku/models/__init__.py"]
use_parentheses = true

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
plugins = "mypy-type-checker"
pretty = true
python_version = "3.13"
show_error_codes = true
strict = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = false

[tool.pydoclint]
allow-init-docstring = true
baseline = "pydoclint-baseline.txt"
check-style-mismatch = true
generate-baseline = true
show-filenames-in-every-violation-message = true
skip-checking-short-docstrings = false
style = 'google'

[tool.pylint.main]
disable = [
  "E0401", # import-error
  "R0902", # too-many-instance-attributes
  "R0903", # too-few-public-methods
  "W0212", # protected-access -> Best management with ruff
  "W0511", # fixme
  "W0613", # unused-argument -> Best management with ruff
  "W1113", # keyword-arg-before-vararg -> Best management with ruff
]
enable = "all"
msg-template = "{line}:{column}: {msg_id}: {msg} ({symbol})"
output-format = "text"

[tool.pytest.ini_options]
addopts = "--cov=src/models --cov-report=term-missing"
pythonpath = "src"
testpaths = "tests"

[tool.ruff]
exclude = ["*.ipynb"]
fix = true
indent-width = 4
line-length = 88
output-format = "grouped"
preview = true
show-fixes = true
target-version = "py313"
unsafe-fixes = false

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["sudoku"]

[tool.ruff.lint]
ignore = [
  "CPY001", # missing-copyright-notice
  "FIX001", # line-contains-fixme
  "FIX002", # line-contains-todo
  "FIX004", # line-contains-hack
  "G004", # logging-f-string
  "TD001", # invalid-todo-tag
  "TD002", # missing-todo-author
  "TD003", # missing-todo-link
  "TRY400", # error-instead-of-exception
]
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"
